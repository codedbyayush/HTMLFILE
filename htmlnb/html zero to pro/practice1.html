<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>College Event Registration Form</h1>
    <form>
        <label>Participant Name:</label>
        <input type ="text" name="participant_name" placeholder="Enter your name"><br><br>
        <label>Event Name:</label>
        <input type = "text" name="event_name" placeholder="Enter event name"><br><br>
        <label>Date of Event:</label>
        <input type = "date" name="event_date"><br><br>
        <label>Contact Number:</label>
        <input type="tel" name="contact_number" placeholder="Enter your contact number"><br><br>
        <label>Email Address:</label>
        <input type="email" name="email_address" placeholder="Enter your email"><br><br>
        <label>Event Type:</label>  
        <select name ="event_type">
            <option value ="sports">Sports</option>
            <option value ="cultural">Cultural</option>
            <option value ="technical">Technical</option>
            <option value ="academic">Academic</option>
        </select><br><br>
        <label>Additional Requests/Comments:</label><br>
        <textarea name="comments" rows="4" cols="40"></textarea><br><br>
        <input type="checkbox" name ="all the above informations are correct about me">All the above information is correct about me hence if could not participate report to event manager office till 12:00 pm on 30 january 2026 <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

        
    </form>
    
</body>
</html>
