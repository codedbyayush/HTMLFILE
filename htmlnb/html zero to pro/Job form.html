<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Job Application Form</h1>
    <form action ="submit" method="post">
        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your full name"><br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email"><br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone" placeholder="Enter your phone number"><br><br>

        <label>Position Applied For:</label>
        <input type="text" name="position" placeholder="Enter the position you are applying for"><br><br>

        <label>Resume:</label>
        <input type="file" name="resume"><br><br>

        <label>Cover Letter:</label><br>
        <textarea name="coverletter" rows="4" cols="40" placeholder="Write your cover letter here"></textarea><br><br>
        <label>Preferred Time:</label>
        <input type="time" name="preferred_time"><br><br>

        <label>Available Start Date:</label>
        <input type="date" name="available_start_date"><br><br>

        <label>Expected Salary:</label>
        <input type="number" name="salary" placeholder="Enter your expected salary"><br><br>
        <input type="checkbox" name="terms">I agree to the terms and conditions<br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <input type="button" value="Cancel">
        
    </form>
</body>
</html>
