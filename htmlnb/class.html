<!DOCTYPE html>
<html lang="en">
<head>
    <title>Text Formatting </title>
</head>
<body>
    <h2>Text Formatting example</h2>
    <p>This is <b>bold text</p>
    <p>This is<i> italic</i> tag</p>
    <p>This is <u>underline</u> tag</p>
    <p>This is <mark>highlight</mark> tag</p>
    <p>This is <small>small</small> tag</p>
    <p>This is <big>big</big> tag</p>
    <p>This is <del>delete</del> tag and <ins> inserted </ins> tag.</p>
    <p>Water Formula : H<sub>2</sub>O</p>
    <p>Power: 2<sup>10</sup> = 1048 </p>




</body>
</html>
