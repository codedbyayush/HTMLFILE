<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
</head>
<style>
    p{
        color: darkblue;
        text-align: justify;
        text-decoration: none;
        text-transform: capitalize;
        text-indent: 20px;
        text-shadow: 2px 2px 5px blue;
        letter-spacing: 2px;
        word-spacing: 20px;
        line-height: 5;
        font-family: Georgia;
        font-size: 18px;
        font-style: italic;
        font-weight: bold;
    }
    h3{
        color: green ;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 20px 20px 5px lightgreen;
    }
    </style>
    </head>
    <body>
        <p>This is a sample paragraph demonstrating text </p>
    </body>
    <h3>CSS is a type of HTML</h3>
    



    
</html>
